<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MJ — Full-Stack Developer">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#3B82F6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="#0A0A0A"/>
  <rect width="900" height="220" fill="url(#grid)"/>
  <rect width="900" height="220" fill="url(#fade)" opacity="0.4"/>

  <rect x="24" y="24" width="852" height="172" rx="10" fill="#0D0D0D" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1"/>

  <circle cx="48" cy="48" r="5" fill="#3B82F6" fill-opacity="0.7"/>
  <circle cx="66" cy="48" r="5" fill="#3B82F6" fill-opacity="0.45"/>
  <circle cx="84" cy="48" r="5" fill="#3B82F6" fill-opacity="0.25"/>
  <text x="450" y="52" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#3B82F6" fill-opacity="0.55">~/iammjdev</text>

  <line x1="24" y1="66" x2="876" y2="66" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>

  <text x="52" y="118" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#3B82F6" fill-opacity="0.7">$ whoami</text>
  <text x="52" y="150" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="34" fill="#F5F5F5">MJ <tspan fill="#3B82F6">/</tspan> Full-Stack Developer</text>
  <text x="52" y="178" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#8B8B8B" textLength="486">Web systems, cloud architecture, and clean, dependable code.</text>

  <rect x="546" y="167" width="9" height="15" fill="#3B82F6">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="24" y="194" width="852" height="2" fill="url(#accentLine)"/>
